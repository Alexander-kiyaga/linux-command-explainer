---
- name: Install an explicitly verified LinuxLab release
  hosts: web
  become: true
  vars:
    release_root: /opt/linuxlab
    app_user: linuxexplainer
    ai_requests_per_minute: 6
    ai_burst: 2
    ai_max_inflight: 1
    release_dir: "{{ release_root }}/releases/{{ release_commit | default('MISSING') }}"
    stage_dir: "{{ release_root }}/releases/.staging-{{ release_commit | default('MISSING') }}"
    incoming_archive: "{{ release_root }}/incoming/{{ release_commit | default('MISSING') }}.tar.gz"

  pre_tasks:
    - name: Read deployment checkout commit on the controller
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", rev-parse, HEAD]
      register: controller_commit
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Check deployment checkout cleanliness on the controller
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", status, --porcelain=v1, --untracked-files=all]
      register: controller_status
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Validate explicit release and deployment settings
      ansible.builtin.assert:
        that:
          - controller_commit.stdout == (release_commit | default(''))
          - controller_status.stdout == ''
          - (release_artifact | default('')) is match('^/')
          - (release_commit | default('')) is match('^[0-9a-f]{40,64}$')
          - (release_sha256 | default('')) is match('^[0-9a-f]{64}$')
          - (secrets_file | default('')) is match('^/')
          - (ai_requests_per_minute | string) is match('^[0-9]+$')
          - ai_requests_per_minute | int >= 1
          - ai_requests_per_minute | int <= 60
          - (ai_burst | string) is match('^[0-9]+$')
          - ai_burst | int >= 0
          - ai_burst | int <= 10
          - (ai_max_inflight | string) is match('^[0-9]+$')
          - ai_max_inflight | int >= 1
          - ai_max_inflight | int <= 2
        fail_msg: Explicit release identity, secrets path, and safe AI limits are required.

    - name: Inspect release archive on the controller
      ansible.builtin.stat:
        path: "{{ release_artifact }}"
        checksum_algorithm: sha256
      register: local_archive
      delegate_to: localhost
      become: false

    - name: Require the exact expected release archive
      ansible.builtin.assert:
        that:
          - local_archive.stat.isreg | default(false)
          - local_archive.stat.checksum | default('') == release_sha256

    - name: Verify archive paths and embedded commit before transfer
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/release.py"
          - verify
          - --artifact
          - "{{ release_artifact }}"
          - --commit
          - "{{ release_commit }}"
          - --sha256
          - "{{ release_sha256 }}"
          - --repo
          - "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Inspect private environment file on the controller
      ansible.builtin.stat:
        path: "{{ secrets_file }}"
      register: local_secrets
      delegate_to: localhost
      become: false

    - name: Require an existing private environment file
      ansible.builtin.assert:
        that:
          - local_secrets.stat.isreg | default(false)
          - local_secrets.stat.mode | default('') in ['0400', '0600']
        fail_msg: The private environment source must exist and be owner-readable only (0400 or 0600).

  tasks:
    - name: Install web server and smoke-check client
      # Amazon Linux 2023 ships curl-minimal, which provides the curl command.
      # Requesting the full curl package conflicts with that default package.
      ansible.builtin.command: dnf install -y nginx curl-minimal
      register: packages
      changed_when: "'Nothing to do' not in packages.stdout"

    - name: Verify curl is available for deployment smoke checks
      ansible.builtin.command: curl --version
      changed_when: false

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_user }}"
        system: true

    - name: Create application service account
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_user }}"
        system: true
        create_home: false
        shell: /sbin/nologin

    - name: Create release layout
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ release_root }}", group: root, mode: '0755' }
        - { path: "{{ release_root }}/releases", group: root, mode: '0755' }
        - { path: "{{ release_root }}/incoming", group: root, mode: '0700' }
        - { path: "{{ release_root }}/shared", group: "{{ app_user }}", mode: '0750' }
        - { path: "{{ release_root }}/tools", group: root, mode: '0755' }
        - { path: "{{ release_root }}/prepared", group: root, mode: '0700' }

    - name: Inspect active LinuxLab release and legacy service
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ release_root }}/current"
        - /etc/systemd/system/linux-explainer.service
        - /etc/nginx/nginx.conf
        - /opt/linux-command-explainer
        - /opt/linux-command-explainer/.env
      register: migration_paths
      no_log: true

    - name: Identify a first deployment over the legacy application
      ansible.builtin.set_fact:
        legacy_first_deployment: "{{ not migration_paths.results[0].stat.exists and migration_paths.results[1].stat.exists }}"

    - name: Require a complete recoverable legacy installation
      ansible.builtin.assert:
        that:
          - migration_paths.results[2].stat.isreg | default(false)
          - migration_paths.results[3].stat.isdir | default(false)
          - migration_paths.results[4].stat.isreg | default(false)
        fail_msg: Legacy service, Nginx configuration, application directory and private environment must exist before first migration.
      when: legacy_first_deployment

    - name: Observe whether Nginx was already serving before deployment
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_was_active
      changed_when: false
      failed_when: false

    - name: Observe whether the legacy application service is active
      ansible.builtin.command: systemctl is-active linux-explainer
      register: legacy_service_was_active
      changed_when: false
      failed_when: false
      when: legacy_first_deployment

    - name: Require a running legacy recovery target
      ansible.builtin.assert:
        that:
          - nginx_was_active.rc == 0
          - legacy_service_was_active.rc == 0
        fail_msg: First migration requires the legacy Nginx and application services to be running before preparation.
      when: legacy_first_deployment

    - name: Verify the existing legacy root page before migration
      ansible.builtin.command:
        argv: [curl, --noproxy, '*', --fail, --silent, --show-error, --output, /dev/null, http://127.0.0.1/]
      changed_when: false
      when: legacy_first_deployment

    - name: Create protected legacy configuration backup directory
      ansible.builtin.file:
        path: "{{ release_root }}/legacy-recovery"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: legacy_first_deployment

    - name: Preserve original service and Nginx configuration before preparation
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ release_root }}/legacy-recovery/{{ item.name }}"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      loop:
        - { src: /etc/systemd/system/linux-explainer.service, name: linux-explainer.service }
        - { src: /etc/nginx/nginx.conf, name: nginx.conf }
      when: legacy_first_deployment

    - name: Check whether this commit has already been installed
      ansible.builtin.stat:
        path: "{{ release_dir }}"
        follow: false
      register: existing_release

    - name: Refuse to overwrite an immutable release
      ansible.builtin.assert:
        that:
          - not existing_release.stat.exists
        fail_msg: This release directory already exists; use rollback or a new commit rather than extracting over it.

    - name: Remove an incomplete staging directory from a prior failed attempt
      ansible.builtin.file:
        path: "{{ stage_dir }}"
        state: absent

    - name: Create fresh staging directory
      ansible.builtin.file:
        path: "{{ stage_dir }}"
        state: directory
        owner: root
        group: "{{ app_user }}"
        mode: '0755'

    - name: Transfer explicitly verified release archive
      ansible.builtin.copy:
        src: "{{ release_artifact }}"
        dest: "{{ incoming_archive }}"
        owner: root
        group: root
        mode: '0600'

    - name: Verify transferred archive checksum
      ansible.builtin.stat:
        path: "{{ incoming_archive }}"
        checksum_algorithm: sha256
      register: remote_archive

    - name: Require matching transferred bytes
      ansible.builtin.assert:
        that:
          - remote_archive.stat.checksum == release_sha256

    - name: Extract only into the fresh staging directory
      ansible.builtin.unarchive:
        src: "{{ incoming_archive }}"
        dest: "{{ stage_dir }}"
        remote_src: true
        owner: root
        group: "{{ app_user }}"

    - name: Read staged release identity
      ansible.builtin.slurp:
        src: "{{ stage_dir }}/release.json"
      register: staged_identity

    - name: Require staged commit identity
      ansible.builtin.assert:
        that:
          - (staged_identity.content | b64decode | from_json).commit == release_commit

    - name: Create a virtual environment inside this release
      ansible.builtin.command:
        argv: [/usr/bin/python3.12, -m, venv, "{{ stage_dir }}/venv"]
        creates: "{{ stage_dir }}/venv/bin/python"

    - name: Install pinned dependencies into this release
      ansible.builtin.command:
        argv:
          - "{{ stage_dir }}/venv/bin/python"
          - -m
          - pip
          - install
          - --no-cache-dir
          - -r
          - "{{ stage_dir }}/requirements.txt"
      register: pip_install
      changed_when: true

    - name: Install private runtime environment outside releases
      ansible.builtin.copy:
        src: "{{ secrets_file }}"
        dest: "{{ release_root }}/shared/runtime.env"
        owner: root
        group: "{{ app_user }}"
        mode: '0640'
      no_log: true
      diff: false

    - name: Validate staged release files and virtualenv
      ansible.builtin.import_tasks: tasks/validate_staged_release.yml

    - name: Install atomic release switch tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/switch_release.py"
        dest: "{{ release_root }}/tools/switch_release.py"
        owner: root
        group: root
        mode: '0755'

    - name: Prepare conservative Gunicorn service without activating it
      ansible.builtin.template:
        src: templates/linux-explainer.service.j2
        dest: "{{ release_root }}/prepared/linux-explainer.service"
        owner: root
        group: root
        mode: '0644'

    - name: Prepare and validate Nginx without changing its active configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "{{ release_root }}/prepared/nginx.conf"
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/nginx -t -c %s

    - name: Finalize clean release directory
      ansible.builtin.command:
        argv: [mv, --, "{{ stage_dir }}", "{{ release_dir }}"]
      changed_when: true

    - name: Verify Gunicorn from the finalized release without binding
      ansible.builtin.command:
        argv: ["{{ release_dir }}/venv/bin/python", -m, gunicorn, --check-config, "wsgi:app"]
        chdir: "{{ release_dir }}"
      become_user: "{{ app_user }}"
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
      changed_when: false

    - name: Activate, verify, or roll back the release
      block:
        - name: Atomically switch current and save prior release
          ansible.builtin.command:
            argv: [/usr/bin/python3, "{{ release_root }}/tools/switch_release.py", activate, --root, "{{ release_root }}", --commit, "{{ release_commit }}"]
          changed_when: true

        - name: Record successful release switch for conditional recovery
          ansible.builtin.set_fact:
            release_switched: true

        - name: Activate prepared Gunicorn service configuration
          ansible.builtin.copy:
            src: "{{ release_root }}/prepared/linux-explainer.service"
            dest: /etc/systemd/system/linux-explainer.service
            remote_src: true
            owner: root
            group: root
            mode: '0644'

        - name: Restart the existing service name on the new release
          ansible.builtin.systemd_service:
            name: linux-explainer
            daemon_reload: true
            enabled: true
            state: restarted

        - name: Probe new Gunicorn directly before activating Nginx configuration
          ansible.builtin.command:
            argv: [curl, --noproxy, '*', --fail, --silent, --show-error, --output, /dev/null, http://127.0.0.1:8000/health]
          changed_when: false
          register: preliminary_health
          until: preliminary_health.rc == 0
          retries: 5
          delay: 2

        - name: Activate validated Nginx configuration
          ansible.builtin.copy:
            src: "{{ release_root }}/prepared/nginx.conf"
            dest: /etc/nginx/nginx.conf
            remote_src: true
            owner: root
            group: root
            mode: '0644'
            backup: true
            validate: /usr/sbin/nginx -t -c %s
          register: nginx_config

        - name: Start or reload Nginx after the new release is serving locally
          ansible.builtin.systemd_service:
            name: nginx
            enabled: true
            state: "{{ 'reloaded' if nginx_was_active.rc == 0 else 'started' }}"

        - name: Probe health, all learning pages, and the Bash module worker through Nginx
          ansible.builtin.command:
            argv:
              - curl
              - --noproxy
              - '*'
              - --fail
              - --silent
              - --show-error
              - --output
              - /dev/null
              - --write-out
              - '%{http_code}'
              - "http://127.0.0.1{{ item }}"
          loop: [/health, /, /explain, /playground, /missions, /task-builder, /bash, /static/js/bash/worker.js]
          register: smoke_pages
          changed_when: false
          until: smoke_pages.stdout == '200'
          retries: 5
          delay: 2

        - name: Inspect response security headers through Nginx
          ansible.builtin.command:
            argv: [curl, --noproxy, '*', --fail, --silent, --show-error, --head, http://127.0.0.1/]
          register: smoke_headers
          changed_when: false

        - name: Require production headers
          ansible.builtin.assert:
            that:
              - "'content-security-policy:' in (smoke_headers.stdout | lower)"
              - "'x-content-type-options: nosniff' in (smoke_headers.stdout | lower)"
              - "'x-frame-options: deny' in (smoke_headers.stdout | lower)"
              - "'referrer-policy: no-referrer' in (smoke_headers.stdout | lower)"

        - name: Read private active release identity
          ansible.builtin.slurp:
            src: "{{ release_root }}/current/release.json"
          register: active_identity

        - name: Require exact active commit
          ansible.builtin.assert:
            that:
              - (active_identity.content | b64decode | from_json).commit == release_commit

      rescue:
        - name: Restore the previous LinuxLab release or clear failed first activation
          ansible.builtin.command:
            argv: [/usr/bin/python3, "{{ release_root }}/tools/switch_release.py", rollback, --root, "{{ release_root }}", --allow-empty]
          changed_when: true
          when: release_switched | default(false)

        - name: Restore the original legacy Gunicorn service configuration
          ansible.builtin.copy:
            src: "{{ release_root }}/legacy-recovery/linux-explainer.service"
            dest: /etc/systemd/system/linux-explainer.service
            remote_src: true
            owner: root
            group: root
            mode: '0644'
          when: legacy_first_deployment

        - name: Restore the original legacy Nginx configuration
          ansible.builtin.copy:
            src: "{{ release_root }}/legacy-recovery/nginx.conf"
            dest: /etc/nginx/nginx.conf
            remote_src: true
            owner: root
            group: root
            mode: '0644'
            validate: /usr/sbin/nginx -t -c %s
          when: legacy_first_deployment

        - name: Restore previous LinuxLab Nginx configuration when it changed
          ansible.builtin.copy:
            src: "{{ nginx_config.backup_file }}"
            dest: /etc/nginx/nginx.conf
            remote_src: true
            owner: root
            group: root
            mode: '0644'
            validate: /usr/sbin/nginx -t -c %s
          when:
            - not legacy_first_deployment
            - nginx_config is defined
            - nginx_config.backup_file is defined

        - name: Restart the restored legacy or previous LinuxLab service
          ansible.builtin.systemd_service:
            name: linux-explainer
            daemon_reload: true
            state: restarted
          when: legacy_first_deployment or migration_paths.results[0].stat.exists

        - name: Reload restored Nginx configuration
          ansible.builtin.systemd_service:
            name: nginx
            state: reloaded
          when: legacy_first_deployment or (nginx_config is defined and nginx_config.backup_file is defined)

        - name: Check recovered application through Nginx
          ansible.builtin.command:
            argv: [curl, --noproxy, '*', --fail, --silent, --show-error, --output, /dev/null, http://127.0.0.1/]
          changed_when: false
          register: recovery_health
          until: recovery_health.rc == 0
          retries: 5
          delay: 2
          when: legacy_first_deployment or migration_paths.results[0].stat.exists

        - name: Stop service after failed first install
          ansible.builtin.systemd_service:
            name: linux-explainer
            state: stopped
          when: not legacy_first_deployment and not migration_paths.results[0].stat.exists

        - name: Report failed deployment after rollback
          ansible.builtin.fail:
            msg: New release failed verification; the legacy installation or previous LinuxLab release was restored when available.

    - name: Remove transferred archive after successful activation
      ansible.builtin.file:
        path: "{{ incoming_archive }}"
        state: absent
