---
- name: Deploy Linux Command Explainer
  hosts: web
  become: true

  vars:
    app_dir: /opt/linux-command-explainer
    app_user: linuxexplainer
    local_project: "{{ lookup('ansible.builtin.env', 'HOME') }}/linux-command-explainer"
    # Shared across all three paid Gemini endpoints; tune only after observing traffic.
    ai_requests_per_minute: 6
    ai_burst: 2
    ai_max_inflight: 1

  tasks:
    - name: Validate production AI traffic controls
      ansible.builtin.assert:
        that:
          - (ai_requests_per_minute | string) is match('^[0-9]+$')
          - ai_requests_per_minute | int >= 1
          - ai_requests_per_minute | int <= 60
          - (ai_burst | string) is match('^[0-9]+$')
          - ai_burst | int >= 0
          - ai_burst | int <= 10
          - (ai_max_inflight | string) is match('^[0-9]+$')
          - ai_max_inflight | int >= 1
          - ai_max_inflight | int <= 2
        fail_msg: AI traffic limits must stay within the documented safe ranges.

    - name: Check whether Nginx is installed
      ansible.builtin.command: rpm -q nginx
      register: nginx_package
      changed_when: false
      failed_when: nginx_package.rc not in [0, 1]

    - name: Install Nginx
      ansible.builtin.command: dnf install -y nginx
      when: nginx_package.rc == 1

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_user }}"
        system: true

    - name: Create application service account
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_user }}"
        system: true
        create_home: false
        shell: /sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: "{{ app_user }}"
        mode: "0755"

    - name: Transfer and extract committed application
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/application.tar.gz"
        dest: "{{ app_dir }}"
        owner: root
        group: "{{ app_user }}"
      notify: Restart application

    - name: Create server Python virtual environment
      ansible.builtin.command:
        argv:
          - /usr/bin/python3.12
          - -m
          - venv
          - "{{ app_dir }}/venv"
        creates: "{{ app_dir }}/venv/bin/python"

    - name: Install application dependencies
      ansible.builtin.command:
        argv:
          - "{{ app_dir }}/venv/bin/python"
          - -m
          - pip
          - install
          - -r
          - "{{ app_dir }}/requirements.txt"
      register: pip_install
      changed_when: "'Successfully installed' in pip_install.stdout"
      notify: Restart application

    - name: Privately transfer application environment
      ansible.builtin.copy:
        src: "{{ local_project }}/.env"
        dest: "{{ app_dir }}/.env"
        owner: root
        group: "{{ app_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart application

    - name: Configure application systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/linux-explainer.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Linux Command Explainer
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment=PYTHONUNBUFFERED=1
          Environment=PYTHONDONTWRITEBYTECODE=1
          Environment=FLASK_DEBUG=False
          Environment=GEMINI_MODEL=gemini-3.6-flash
          Environment=API_TIMEOUT_SECONDS=45
          ExecStart={{ app_dir }}/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --timeout 90 --access-logfile - --error-logfile - wsgi:app
          Restart=on-failure
          RestartSec=5
          PrivateTmp=true
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart application

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: /usr/sbin/nginx -t -c %s
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              access_log /var/log/nginx/access.log;
              sendfile on;
              server_tokens off;
              limit_req_zone $binary_remote_addr zone=ai_per_ip:10m rate={{ ai_requests_per_minute }}r/m;
              limit_conn_zone $server_name zone=ai_concurrent:1m;

              server {
                  listen 80 default_server;
                  server_name _;
                  client_max_body_size 16k;
                  limit_req_status 429;
                  limit_conn_status 429;
                  error_page 429 = @ai_limited;
                  error_page 413 = @body_too_large;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 100s;

                  location ~ ^/api/(explain|task-builder/plan|bash/explain)$ {
                      limit_req zone=ai_per_ip burst={{ ai_burst }} nodelay;
                      limit_conn ai_concurrent {{ ai_max_inflight }};
                      proxy_pass http://127.0.0.1:8000;
                  }

                  location @ai_limited {
                      internal;
                      default_type application/json;
                      add_header Retry-After 20 always;
                      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'" always;
                      add_header X-Content-Type-Options nosniff always;
                      add_header Referrer-Policy no-referrer always;
                      add_header X-Frame-Options DENY always;
                      return 429 '{"success":false,"error":"rate_limited","message":"Too many AI requests right now. Please wait and try again."}';
                  }

                  location @body_too_large {
                      internal;
                      default_type application/json;
                      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'" always;
                      add_header X-Content-Type-Options nosniff always;
                      add_header Referrer-Policy no-referrer always;
                      add_header X-Frame-Options DENY always;
                      return 413 '{"success":false,"error":"invalid_request","message":"Request body is too large."}';
                  }

                  location / {
                      proxy_pass http://127.0.0.1:8000;
                  }
              }
          }
      notify: Restart Nginx

    - name: Enable and start application
      ansible.builtin.systemd_service:
        name: linux-explainer
        daemon_reload: true
        enabled: true
        state: started

    - name: Enable and start Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Apply pending service restarts
      ansible.builtin.meta: flush_handlers

    - name: Verify application through Nginx without calling Gemini
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: health
      until: health.status == 200
      retries: 10
      delay: 2

  handlers:
    - name: Restart application
      ansible.builtin.systemd_service:
        name: linux-explainer
        daemon_reload: true
        state: restarted

    - name: Restart Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
